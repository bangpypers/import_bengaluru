- time: 11:00–11:30 AM
  title: How NumPy divides integers really fast (and the bugs I caused doing it)
  organization: PyData Bangalore
  speakers:
    - name: Ganesh Kathiresan
      url: https://www.linkedin.com/in/ganesh-kathiresan/
      image: /Assets/speakers/ganesh.jpeg
  details: >-
    Every AI framework, dataframe library and scientific tool in Python eventually
    bottoms out in NumPy, yet integer division is one of the most expensive things
    a CPU can do. Follow a multi-year contribution journey from replacing division
    by a constant with multiplication and shifts, through portable SIMD on Intel,
    AMD and ARM, to edge cases such as INT_MIN // -1. The session also covers a
    regression shipped to millions of users and what benchmarks, review and fixing
    it revealed about real open-source performance work.
  tba: false

