  tba: false

- time: 12:30–1:00 PM
  title: Don't Migrate Your DAGs. Compile Them.
  organization: What Python's ast module taught us about platform adoption
  speakers:
    - name: Purushotham Pushpavanthar
      url: https://www.linkedin.com/in/purushotham-pushpavanthar/
      image: /Assets/speakers/purushotham.jpeg
  details: >-
    Building the abstraction was the easy part. We designed an Offline Job
    Orchestration Platform—a thin layer over Airflow where a DAG declares intent
    (data, application and runtime) instead of hand-wiring paths, SparkConf and
    Kubernetes manifests—and it worked almost immediately. Then it sat there. More
    than 600 existing DAGs stayed where they were because migrating meant each team
    rewriting its own code on our schedule instead of theirs. Adoption is a cost
    problem, not a persuasion problem, so we stopped writing migration guides and
    shipped the migration itself. A transpiler built on Python's standard-library
    ast module rewrites legacy DAGs onto the new abstraction, while a triage
    classifier identifies which DAGs are automatable and which functions the tool
    should learn next. You'll learn to write your own codemod, what ast gives you
    for free, where it breaks and why the differ mattered more than the generator.
    Takeaways: every user step is an adoption tax; trust is the bottleneck, so ship
    the diff that proves nothing changed; and rejected DAGs are a design review of
    your abstraction. A platform nobody has migrated to is only a proposal.
  tba: false

